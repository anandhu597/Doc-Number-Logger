<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doc Number Logger</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Doc Number Logger</h1>

    <div id="camera-section">
      <h2>Camera</h2>
      <!-- A <video> element (needs autoplay and playsinline attributes to work right) -->
      <!-- Relative parent container -->
      <div
        id="video-container"
        style="position: relative; display: inline-block"
      >
        <video autoplay playsinline id="video"></video>

        <!-- The fixed guide frame overlay -->
        <div id="guide-frame"></div>
      </div>
      <p id="errorMsg"></p>
      <button id="startCamBtn">Start Camera</button>
      <button id="captureBtn" disabled>Capture</button>
      <button id="switchCam">Switch Camera</button>
      <canvas id="canvas" style="display: none"></canvas>
      <img src="" alt="" id="img" />
      <img id="processedImg" />

      <label for="enhanceOcr">Enhance for OCR</label>
      <input type="checkbox" id="enhanceOcr" />

      <!-- Stage 1 will add video/canvas/buttons here -->
    </div>

    <div id="preview-section">
      <h2>Preview</h2>
      <!-- Captured image display -->

      <!-- Add your Scan / Run OCR trigger button here -->
      <!-- <button id="scanBtn" disabled>Scan Document</button> -->
            <button id="scanBtn" >Scan Document</button>


      <!-- Add a loading status indicator for Stage 3 feedback -->
      <p id="ocrStatus"></p>

      <!-- Stage 3: Raw text display container -->
      <pre id="ocrOutput"></pre>
    </div>


    <!-- Stage 4: Dedicated extraction result display -->
      <div id="docNumberContainer" style="margin-top: 10px;">
        <strong>Extracted Document Number:</strong>
        <p id="docNumberResult" style="font-weight: bold; font-size: 1.1em; color: #333;">
          Waiting for scan…
        </p>
      </div>
    </div>

    <div id="log-section">
      <h2>Log</h2>

      <div id="CorrectionArea">
        <input type="text" id="input">
        <button id="confirm-log-btn">Confirm & Log"</button>
      </div>

      <div id="tableArea">

      </div>

      <!-- Stage 5 will add the results table here -->
    </div>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
