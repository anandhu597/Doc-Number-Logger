<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Doc Number Logger</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Doc Number Logger</h1>

    <div id="camera-section">
      <h2>Camera</h2>
      <div id="video-container">
        <video autoplay playsinline muted id="video"></video>
        <div id="guide-frame"></div>
      </div>
      <p id="errorMsg" class="msg-error"></p>
      <button id="startCamBtn">Start Camera</button>
      <button id="stopCamBtn" disabled>Stop Camera</button>
      <button id="captureBtn" disabled>Capture</button>
      <button id="switchCam" disabled>Switch Camera</button>

      <label id="enhanceLabel"><input type="checkbox" id="enhanceOcr" /> Enhance for OCR</label>

      <canvas id="canvas" hidden></canvas>
      <div id="captures">
        <img id="img" alt="Captured image" hidden />
        <img id="processedImg" alt="Enhanced image" hidden />
      </div>
    </div>

    <div id="preview-section">
      <h2>Preview</h2>
      <button id="scanBtn" disabled>Scan Document</button>
      <p id="ocrStatus"></p>
      <pre id="ocrOutput"></pre>

      <div id="docNumberContainer">
        <strong>Extracted Document Number:</strong>
        <p id="docNumberResult">Waiting for scan…</p>
      </div>
    </div>

    <div id="log-section">
      <h2>Log</h2>
      <div id="CorrectionArea">
        <input
          type="text"
          id="input"
          placeholder="Document number"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
          enterkeyhint="done"
        />
        <input type="text" id="noteInput" list="noteList" placeholder="Note (pick or type)" autocomplete="off" />
        <datalist id="noteList">
          <option value="pend-c/s"></option>
          <option value="pend -sign"></option>
          <option value="pend-Supp-docs"></option>
          <option value="pend-sign & Supp-Docs"></option>
          <option value="pend-pod"></option>
        </datalist>
        <button id="confirm-log-btn">Confirm &amp; Log</button>
      </div>
      <p id="logMsg"></p>
      <div id="tableArea"></div>
      <div id="logTools">
        <button id="retryBtn" hidden>Resend failed</button>
        <button id="clearLogBtn" hidden>Clear log</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
